# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [dev, main, master, cran]
  pull_request:
    branches: [dev, main, master, cran]
  workflow_dispatch:

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://inla.r-inla-download.org/R/testing'
          use-public-rspm: true

      - name: Add inla repo
        run: |
          cat('options(repos = c(INLA = "https://inla.r-inla-download.org/R/testing/", getOption("repos")))', file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      - name: Install JAGS
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jags

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::covr, any::xml2

      - name: Test coverage
        run: |
          covr::to_cobertura(covr::package_coverage(), "coverage.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
